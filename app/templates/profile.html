{% extends 'base.html' %}{% set heading = 'Your profile' %}{% block content %}<section class="page-intro"><span class="eyebrow">PATIENT PROFILE</span><p class="muted">Keep your personal and emergency details current.</p></section><section class="panel form-panel"><form method="post" class="form-grid two"><label>Full name<input name="full_name" value="{{ user.full_name }}" required></label><label>Email<input value="{{ user.email }}" disabled></label><label>Phone<input name="phone" value="{{ user.phone or '' }}"></label><label>Age<input type="number" min="0" name="age" value="{{ profile.age or '' }}"></label><label>Gender<input name="gender" value="{{ profile.gender or '' }}"></label><label>Emergency contact<input name="emergency_contact" value="{{ profile.emergency_contact or '' }}"></label><label class="span-2">Caregiver information<textarea name="caregiver_info" rows="3">{{ profile.caregiver_info or '' }}</textarea></label><button class="button primary" type="submit">Save profile</button></form></section>{% endblock %}
