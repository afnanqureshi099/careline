{% extends 'base.html' %}{% set heading = 'Settings' %}{% block content %}<section class="page-intro"><span class="eyebrow">PERSONAL PREFERENCES</span><p class="muted">Choose reminder preferences for your own tracking. Targets are not medical recommendations.</p></section><section class="panel form-panel narrow"><form method="post" class="form-grid"><label>Daily water target (ml)<input type="number" name="water_target_ml" min="1" value="{{ settings.water_target_ml }}" required></label><label>Water reminder times<input name="water_reminder_times" value="{{ settings.water_reminder_times or '' }}" placeholder="08:00, 12:00, 16:00"></label><button class="button primary">Save settings</button></form></section>{% endblock %}
