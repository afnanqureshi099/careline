{% extends 'base.html' %}{% set heading = 'Edit medicine' %}{% block content %}<section class="page-intro"><span class="eyebrow">UPDATE DETAILS</span><p class="muted">Keep this information aligned with your prescription.</p></section><section class="panel form-panel narrow"><form method="post" class="form-grid"><label>Medicine name<input name="name" value="{{ medicine.name }}" required></label><label>Dosage / quantity as prescribed<input name="dosage" value="{{ medicine.dosage }}" required></label><label>Available quantity<input type="number" step="1" min="0" name="quantity" value="{{ medicine.quantity }}"></label><label>Low-stock threshold<input type="number" step="1" min="0" name="low_stock_threshold" value="{{ medicine.low_stock_threshold }}"></label><label>Start date<input type="date" name="start_date" value="{{ medicine.start_date or '' }}" min="{{ (medicine.start_date or '') }}"></label><label>End date<input type="date" name="end_date" value="{{ medicine.end_date or '' }}" min="{{ medicine.start_date or '' }}"></label><label>Instructions<input name="instructions" value="{{ medicine.instructions or '' }}"></label><label>Notes<textarea name="notes" rows="3">{{ medicine.notes or '' }}</textarea></label><button class="button primary">Save changes</button></form></section>{% endblock %}
