{% extends 'base.html' %}{% set heading = 'Schedule reminder' %}{% block content %}<section class="page-intro"><span class="eyebrow">{{ medicine.name|upper }}</span><p class="muted">Add one reminder time at a time. You can create multiple times for this medicine.</p></section><section class="panel form-panel narrow"><form method="post" class="form-grid"><label>Reminder time<input type="time" name="time" required></label><label>Repeat frequency<select name="frequency"><option>Once</option><option selected>Daily</option><option>Weekly</option><option>Custom</option></select></label><label>Start date<input type="date" name="start_date" required></label><label>End date<input type="date" name="end_date"></label><button class="button primary">Save reminder</button></form></section>{% endblock %}
